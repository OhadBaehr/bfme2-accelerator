; BFME2 Accelerator

[Engine]
; Raise the render frame cap, in memory - gamedata.ini is not touched and nothing is
; written into the game folder. 0 or missing leaves the engine's own cap alone.
;
; On its own this also speeds the GAME up, because the engine advances one logic
; sub-frame per rendered frame. Set LogicHz below to hold the simulation steady.
FpsLimit = 60

; Hold the simulation at this many logic frames a second however high the frame rate
; goes. 30 is the rate the stock 30 fps cap works out to, so FpsLimit = 60 with
; LogicHz = 30 renders twice as often at exactly stock game speed. 0 = off.
;
; This uses a render-only frame path the engine already has: the per-frame scheduler
; asks whether to advance the simulation (an external DLL's CanAppContinue, which
; stock never has), and on a "no" it renders the frame and skips the sub-frame
; advance. The logic sequence, its order and its sub-frame numbering are untouched.
LogicHz = 30

; Carry animation forward on the frames that only render. Poses are computed while
; rendering, every frame, from a millisecond counter that normally only moves when the
; simulation does - so without this, limbs animate at LogicHz however high the frame
; rate goes. The engine's own value is put back before each logic frame, so the
; simulation never reads a time we wrote. 1 = on, 0 = off.
SmoothAnimation = 1

; Draw runs of the same unit mesh in ONE draw call. A battle frame is ~7,000 draw calls,
; one per mesh, although the engine already sorts identical models next to each other
; and has a path that draws several in one call (it uses it for props, never for units).
; This feeds unit meshes through that same path: the palette carries every mesh's bones
; and the vertex buffer is swapped for a twin holding several copies. Each vertex is
; transformed by exactly the bone it was before, so the picture is the same.
; Nothing is merged until our palette has matched the engine's own on 3,000 draws.
; Ctrl+F11 switches it on and off in game for an A/B look. 1 = on, 0 = off.
MergeDraws = 1

; The most meshes that may share a draw (2..16), and the memory the multi-copy buffers
; may take, in megabytes.
MergeMaxMeshes = 8
MergeBudgetMB = 48

; In-between frames. In a big battle the game itself cannot produce more than ~25 frames a
; second: one frame of game work takes that long and it all sits on one thread. With this on,
; the render thread draws one extra frame between every two of the game's - the same scene,
; with every unit's bones, every object and the camera halfway between the two frames - and
; shows it between them. It is real geometry drawn by the game's own shaders, not a pixel
; warp.
; What it costs: what you see is about one extra game frame behind your input (roughly
; 30 ms at 25 fps, less the faster the game runs), and what is not blended - particles and
; the interface - still moves at the game's own rate.
; On means on: for every frame, at any frame rate. Nothing switches it off by itself except
; a fault inside it. Ctrl+F10 switches it on and off in game. 1 = on, 0 = off.
InBetweenFrames = 1
; InBetweenDump: pictures for looking at a problem. Once a match is under way, this many pairs (the
; in-between frame and the game's frame after it) and two pictures shown from another camera are written
; next to the DLL as *_dump_*.bmp - each is a hitch of about a tenth of a second. Once only: they are not
; written again until this file is saved anew. 0 = none.
InBetweenDump = 0

; A steady beat for the pictures. The game's frames do not come evenly - a frame with a
; logic step in it is longer than one without, new terrain costs a frame a few milliseconds -
; but the camera scrolls by the same distance every frame, so pictures shown the moment they
; are finished make a pan jerk. With this on, pictures go on screen half a frame period
; apart, and a frame that is ready early waits for its place. What it costs: while frames
; come unevenly the picture is up to 20 ms (never more than half a frame) further behind
; your input; when they come evenly, next to nothing. Needs InBetweenFrames.
; Ctrl+F9 switches it on and off in game to compare. 1 = on, 0 = off.
PictureBeat = 1

; Pan pictures made on the GPU. Needs InBetweenFrames. While the camera scrolls, every
; picture is shown from where the camera is at the moment it goes on screen, not from where
; it was when the game drew it: the ground is a plane, so the picture as another camera
; would see it is one rectangle drawn by the graphics card (no draw calls, no game thread).
; A picture that is on time is shown as it is; one that is early or late is moved the few
; pixels that makes up for; and when a frame is late altogether, the picture on screen is
; shown again from further along the pan (up to a quarter of a second ahead) instead of
; standing still. The camera itself is stepped by the time that really passed. The
; interface is left where it is; health bars move with the ground.
; What a moved picture is not: drawn by the game. Things standing up from the ground lean a
; little, a strip at the edge the camera moves towards is left as it was, and units keep
; their pose while one picture is shown twice. Nothing of this happens for a camera that
; stands still. Ctrl+F8 switches it on and off in game to compare. 1 = on, 0 = off.
PanPictures = 1
; PanRefreshBeat: while the camera scrolls, exactly one picture goes up for each refresh of the screen, at any
; frame rate: a moment before each refresh the newest of the game's pictures that is ready, shown from where the
; camera is at that refresh; if none is ready, the one on screen again from further along. The moment comes
; from the screen itself (Windows reports each refresh of the monitor). Before, at 50 to 60 game frames with a
; picture in between each, about 110 pictures a second were handed to a 60 Hz screen: every refresh showed
; parts of two, joined at a line that wandered over the screen, and a stall of the game was a stall of the
; scroll. The scroll now runs a few hundredths of a second behind the mouse (it is read off where the camera
; has been, not guessed ahead - guessed ahead it overshoots when you stop) and comes to rest over two or three
; refreshes. The frame counter of DXVK reads the screen's rate (60) while you scroll: that is this, not a drop.
; Needs PanPictures. 1 = on; 2 = only while the game draws fewer pictures than the screen shows; 0 = pictures
; on the game's own beat.
PanRefreshBeat = 1
; PanLeadMs (not set = 2, or 4 in DXVK's tear-free mode): how long before a refresh its picture is handed
; over. With vsync off DXVK puts a picture on screen the moment the GPU has it; handed over this long before the
; refresh, the line where the old and the new picture meet lies at the bottom or top edge of the screen. If
; you see it a hand's width above the bottom edge while scrolling, make this smaller (1.0); if it shows below
; the top edge, larger (3.0).
; PanLeadMs = 2.0
; TearFree: no tear line at all. DXVK has a second way of showing pictures with vsync off ("mailbox"): the
; newest finished picture goes up at the screen's next refresh - nothing waits for the screen, the frame rate
; is not limited, and old and new picture never meet in a line. Which way DXVK uses is your DXVK setting
; (DXVK_CONFIG / dxvk.conf); with 1 the accelerator adds "dxvk.tearFree = True" to this game process's own
; copy of it when it starts - your setting itself is not changed, and if it already names dxvk.tearFree it is
; left alone. Tried on this DXVK: your configuration gives immediate mode, with the addition mailbox mode.
; Costs up to one refresh (16 ms) between a picture being finished and being seen. 0 = DXVK as you set it.
TearFree = 0
; PanSharp: a picture shown from where the camera has scrolled to is the game's picture with every pixel taken
; from somewhere else in it. 1 = from the nearest pixel: every pixel on screen is one the game drew, the scene
; sits within half a pixel of its place. 0 = blended from the four pixels around that place: exactly in place,
; but soft - and in a scroll such pictures alternate with ones shown as drawn, so the screen flickers between
; sharp and soft. Needs PanPictures.
PanSharp = 1
; SmoothShadows: shadow edges without squares. The game asks its shadow picture four yes/no questions for
; every pixel - is this point, and the three next to it, hidden from the sun? - and adds the answers up. All
; pixels inside one point of the shadow picture get the same answers, so the edge of every shadow, on the
; ground and on characters, is built of squares in five shades: three or four screen pixels wide at 4K on a
; default map, twenty in a scripted close-up. That is the game's own shader, with or without the accelerator.
; With 1 every pixel shader that does this (166 of them: terrain, objects, vegetation, water) gets a twin,
; made when it is first used, that asks nine points - each at its exact centre, with the game's own test -
; and weights the answers by where the pixel lies between them: the edge is an even gradient at any
; magnification. Inside a shadow and in full light nothing changes. Only the GPU works more (nine reads of
; the shadow picture instead of four). Best together with ShadowMapScale = 2. 0 = the game's own lookup.
SmoothShadows = 0
; ShadowMapMatch: shadows as fine on every map as on the mod's default maps. The game draws its shadows from
; one square picture of the scene as the sun sees it, stretched over everything up to a reach the map names.
; The mod's default is 2048 points over a reach of 1500. About twenty maps stretch theirs over a longer
; reach - Helm's Deep, the Hornburg and Erebor fortress maps: 6000 - and most keep the 2048 points, so every
; point covers four times the ground: a shadow's edge is built of visible squares there, most of all in a
; mission's scripted close-ups (that is the game's own picture, with or without the accelerator). With 1 such
; a map gets a proportionally larger shadow picture (8192 points at most), as the mod itself does for its
; main-menu scene. Maps on the default numbers are not touched. Only the GPU works more (about 770 MB of
; video memory on those maps). 0 = every map as it says.
ShadowMapMatch = 0
; ShadowMapScale: a finer shadow map. The game draws its shadows from one square picture of the scene as the
; sun sees it; its size comes from the mod (1024 or 2048) or from the map (Helm's Deep: 2048, stretched over a
; reach of 6000). From the usual camera that is fine; in a close-up - a mission's scripted scene - a shadow's
; edge turns into visible squares. That is the game's own picture, with or without the accelerator. 2 or 4
; makes the map that many times as wide and as high (8192 at most): the squares get that much smaller. Only the
; GPU works more (about 770 MB of video memory at 8192); it changes the picture everywhere - edges get finer
; and a little harder. 1 = as the map says (default).
ShadowMapScale = 1

; Camera scrolling at one speed. The game moves the camera a fixed distance per rendered
; frame, so with the frame cap raised it scrolls faster where frames are fast (twice the
; stock speed at 60) and slower in a heavy battle, and a pan changes speed as the frame
; rate does. With this on, the distance is scaled by the frame time: the camera scrolls at
; the speed the stock game has at its 30 frames a second, whatever the frame rate - and a
; single slow frame no longer changes the step of the frames after it.
; 1 = on, 0 = off.
SteadyScrollSpeed = 1

; How fast that is, as a multiple of the stock game's scrolling speed at 30 frames a second
; (0.25 to 4). 1.0 = the stock speed. Needs SteadyScrollSpeed. The game's own scroll-speed
; option still works on top of it.
ScrollSpeed = 1.0

; Scrolling by pushing the mouse against the screen edge does not start at full speed: the
; game itself lets it gather speed over a quarter of a second (ScreenEdgeScrollRampTime in
; its gamedata.ini; the keys and the right-button drag have no such ramp). With in-between
; frames the picture on screen is also about 50 ms behind the game, and the two together
; are felt as "nothing happens for 0.3 s".
; ScrollRampLead: the ramp is read as if the scroll had begun as much earlier as the
; pictures are behind, so on screen the camera is at full speed when it would be in the
; stock game. 1 = on, 0 = off.
; EdgeScrollRampMs: how long the edge scroll takes to reach full speed, in milliseconds.
; -1 = the game's own (250); 0 = full speed at once. It is applied in memory only - the
; game's files are not touched.
ScrollRampLead = 1
EdgeScrollRampMs = -1

; The game's own crash when a skirmish is left through Exit (an exception as the game
; closes). While the computer players are torn down, one of their teams writes into an
; attack area that has just been freed, and the next allocation trips over it. With this
; on, attack areas destroyed in that teardown stay in memory until the teardown is over.
; Nothing changes during play. 1 = on, 0 = off.
ExitFix = 1

; Texture work on worker threads. Most of the mod's textures ship without their smaller
; versions (mip levels), so the game has them built and compressed while it loads - one
; texture after another, on the same thread that runs everything else. That was about ten
; seconds of a load screen and most of the slow seconds after it. With this on, that work
; runs on several cores at once and the game thread only hands it over. The textures come
; out byte for byte as the game would have made them (checked against all 11,911 texture
; files of the game and the mod).
; -1 = on, as many threads as suit the processor; a number = on with that many; 0 = off.
TextureThreads = -1

; File read-ahead. The engine reads model and animation files a few bytes at a time, and
; every one of those reads is its own trip into Windows - millions of them in a load (a
; quarter of a save load was spent there). With this on they are answered from memory, read
; ahead 4 to 64 KB at a time. The game gets the same bytes and the same results (checked
; against the C runtime's own functions, and once more inside the game when it starts).
; 1 = on, 0 = off.
FileReadAhead = 1

; Decoded textures kept on disk. Building a texture's smaller versions takes the processor
; ten milliseconds for an ordinary texture and up to seventy for a large one, every time it
; is loaded - on the worker threads above, but the picture still waits for it, which is why
; the seconds after a load are slow and a pan over new ground hitches. With this on, what
; was built is kept in the folder "texcache" next to this file and read back the next time
; (about a millisecond). The texture is byte for byte the same (checked on all 11,911
; texture files of the game and the mod, each result read back and compared).
; The FIRST load of a map or an army fills the folder; from the second on it is read.
; Everything the game and the mod have comes to about 2.3 GB. TextureCacheMB is the most
; the folder may hold: when it is over at start, the files not used for longest go.
; Deleting the folder costs nothing but the time to fill it again. 1 = on, 0 = off.
TextureCache = 1
TextureCacheMB = 6000

; Two slow spots in the engine's own loading code, done without the waste - the result is
; the same in both.
; ScriptTableSort: the script engine sorts its whole table of event lists again after every
; single list it reads, with a sort that copies each entry - and every event name in it -
; at each step (the first second of every load).
; StreamerSets: the asset streamer copies its whole set of wanted assets, twice, every time
; one asset is added to it: a quarter of the time a saved game's objects take to come back
; (the bar standing at 97 %), and a hitch whenever something new comes into view in play.
; 1 = on, 0 = off.
ScriptTableSort = 1
StreamerSets = 1

; The game's files opened ahead of it. The first time a file is opened after the computer
; was started (or the virus scanner updated), Windows Defender looks at it before the open
; returns: about 6 ms a file where it was measured, against 0.03 ms for every open after that.
; The game opens each file it needs on its main thread, one at a time - a few thousand of
; them while a saved game comes back and in the first seconds of a match. That was half of
; the time the bar stands at 97 % and three quarters of the seconds at 6 frames a second
; after it, and it is a hitch whenever something not seen yet in this session comes into
; view. With this on, a few threads open every file under the game's and the mod's folders
; once, in the background, from the moment the game starts (the ones it used last time
; first; kept in filewarm.lst next to this file): read access only, closed at once, nothing
; read or changed. When the game opens a file after that, the scanner has already seen it.
; The scanning itself is real work - about half the processor for half a minute after a
; restart of the computer, about a second when the scanner still remembers the files - so
; fewer threads run while frames are being drawn.
; FileWarm: 1 = on, 0 = off. FileWarmThreads: -1 = chosen for this processor, or 1 to 16.
FileWarm = 1
FileWarmThreads = -1

; Ground patch textures on several cores. The ground is drawn in patches of 16 x 16 cells,
; and every patch near the camera has its own texture, which the game makes when the patch
; comes into view and throws away when it leaves: about thirty a second while the camera
; scrolls, each one composed cell by cell on the game thread (3 ms and more apiece, up to
; four in one frame - the frames of a pan that take 10 to 18 ms longer than the others).
; With this on, the cells of a texture are composed on several threads at once and its
; smaller versions are written directly instead of by a D3DX call. The texture is byte for
; byte the same: the first ones of every session are also built by the game's own code and
; by D3DX and compared (the log says so), and a difference switches this off.
; -1 = as many helper threads as fit this processor, 0 = off, 1 to 15 = that many.
TerrainThreads = -1

; Logic first. With LogicHz set, a frame without logic is put between two logic frames
; whenever there is time for one. Until now it was also started when there was NOT time:
; then the next logic frame came late, frames of two lengths followed each other in no
; order, and units moved in fits - between about 30 and 60 frames a second, which is the
; seconds after a load and any middling battle. With this on, a frame without logic is
; only started when it will be finished before the next logic frame is due; otherwise the
; game waits the few milliseconds for that logic frame. So the game runs either at 60
; frames a second - one with logic, one without, 16.7 ms apart - or, when a frame with
; logic leaves no room for a second one, at an even 30 (60 pictures a second with
; InBetweenFrames), and no longer at an uneven number in between. Which of the two it is
; goes into the log when it changes. 1 = on, 0 = off.
LogicFirst = 1

; Any number of factions with a working AI. A computer player only plays if the map carries
; a "Skirmish" player of its faction (SkirmishMen, SkirmishElves, ...); without one the
; engine makes it a player that stands still for the whole game. A map's table holds 20
; players, the neutral ones and the slot players included - so a mod's factions had to fit
; into what is left (Age of the Ring's maps are full with its 11), and a map that lacks one
; has a dead opponent for that faction. With this on, a computer player whose faction has
; no such player in the map gets one made when the game starts, exactly as a map would
; carry it; a map that has it is left alone. Nothing is written to any file.
; 1 = on, 0 = off. In a network game every player has to run this with the same setting:
; a game without it makes that computer a dead player, and the two go out of sync.
; A saved game is rebuilt the same way when it is loaded, so keep this as it was when the
; save was made (a save from a game in which such a computer was dead loads with 0).
FactionAI = 1

; How an in-between picture is drawn. 1 = the render thread keeps the device calls D3DX
; makes for the frame itself and issues them again for the in-between picture, with the
; blended bones, object positions and camera put straight into their shader registers -
; D3DX is not asked a second time (about a fifth less work a picture). It checks itself:
; the first frames are still made by D3DX and compared register by register, later one in
; 512 is, and a single difference switches it off for the session (the log says so in a
; "devpass:" line). 0 = every in-between picture is made through D3DX.
DevicePass = 1

; Diagnostic: writes into the log where the game thread spends a load screen (it sleeps in
; normal play and samples only while a frame is longer than 80 ms). 1 = on, 0 = off.
LoadProfile = 0

; Diagnostic: while the camera is being scrolled, the game thread is sampled through whole
; frames (about 500 times a second), and three seconds after the camera stops the log gets
; what the slow frames of that pan were doing that the others were not. 1 = on, 0 = off.
PanProfile = 0

; Diagnostic: the render thread is sampled a hundred times a second; every thirty seconds
; of play the log gets which queued calls and which modules its time goes to, the game's
; own frame and the in-between picture apart. 1 = on, 0 = off.
RenderProfile = 0

; Measurement only, reads nothing but transforms the game is already about to draw.
MeasurePositions = 0
